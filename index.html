<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row student-crud-row">

            <div class="col-md-12 text-center heading">
                <h1>Student Internship CRUD</h1>
                <P>Mange student internship details</P>
            </div>

            <!-- Form Section -->
            <div class="col-md-6 mt-5 student-form-col">
                <div class="card student-form-card">

                    <div class="card-header student-form-header">
                        <h3>Student Internship Profile CRUD</h3>
                    </div>

                    <div class="card-body student-form-body">
                        <form id="form">

                            <div class="form-group form-field">
                                <label for="rollCode">Roll Code</label>
                                <input type="text" class="form-control" id="rollCode">
                            </div>

                            <div class="form-group form-field">
                                <label for="specialization">Specialization</label>
                                <input type="text" class="form-control" id="specialization">
                            </div>

                            <div class="form-group form-field">
                                <label for="availability">Availability</label>

                                <select class="form-control" id="availability">
                                    <option value="" disabled selected>Select availability</option>
                                    <option value="Part Time">Part Time</option>
                                    <option value="Full Time">Full Time</option>
                                    <option value="Weekend">Weekend</option>
                                </select>
                            </div>

                            <div class="form-group form-field">
                                <label for="portfolio">Portfolio</label>
                                <input type="text" class="form-control" id="portfolio">
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn btn-sm btn-block btn-primary" id="submitBtn">
                                    Add Student
                                </button>

                                <button type="button" class="btn btn-sm btn-block btn-primary d-none" id="updateBtn">
                                    Update Student
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>


            <!-- Table Section -->
            <div class="col-md-6 mt-5 student-table-col" id="hideTable">

                <div class="card student-table-card">

                    <div class="card-body student-table-body">

                        <div class="student-table-wrapper">
                            <table class="table table-bordered w-100 student-table">

                                <thead>
                                    <tr class="text-center student-table-head">
                                        <th>Sr. No.</th>
                                        <th>Roll Code</th>
                                        <th>Specialization</th>
                                        <th>Availability</th>
                                        <th>Portfolio</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>

                                <tbody id="studentContainer">
                                </tbody>

                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
